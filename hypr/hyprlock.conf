# Background
background {
    monitor =
    path = /home/tahmadim/Pictures/Wally/wallhaven-pomo69.jpg
    blur_passes = 2
    blur_size = 4
    contrast = 0.8
    brightness = 0.6
    vibrancy = 0.16
    vibrancy_darkness = 0.05
}

# General
general {
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:10000] echo -e "$(date +"%A, %B %d")"
    color = rgba(202, 158, 230, 0.7)
    font_size = 25
    font_family = Jetbrains Mono
    position = 0, 250
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:10000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(186, 187, 241, 0.7)
    font_size = 120
    font_family = Jetbrains Mono
    position = 0, 150
    halign = center
    valign = center
}

# User-box
shape {
    monitor =
    size = 300, 60
    color = rgba(48, 52, 70, 0.5)
    rounding = -1
    border_size = 0
    border_color = rgba(48, 52, 70, 1)
    rotate = 0
    xray = false
    position = 0, -50
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    color = rgba(242, 213, 207, 0.7)
    font_size = 18
    font_family = Jetbrains Mono
    position = 0, -50
    halign = center
    valign = center
}

# Input Field
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(65, 69, 89, 1)
    inner_color = rgba(65, 69, 89, 0.5)
    check_color = rgba(65, 69, 89, 1)
    font_color = rgba(234, 153, 156, 0.7)
    fade_on_empty = false
    font_family = Jetbrains Mono
    placeholder_text = <i><span foreground="##ea999cb3">Password</span></i>
    hide_input = false
    position = 0, -130
    halign = center
    valign = center
}

# Reboot
label {
    monitor =
    text = <span>󰜉 </span>
    color = rgba(166, 209, 137, 0.7)
    font_size = 50
    onclick = reboot
    position = 20, 100
    halign = center
    valign = bottom
}

# Power off
label {
    monitor =
    text = <span>󰐥 </span>
    color = rgba(231, 130, 132, 0.7)
    font_size = 50
    onclick = shutdown now
    position = 840, 100
    halign = left
    valign = bottom
}

# Suspend
label {
    monitor =
    text = <span>󰤄 </span>
    color = rgba(140, 170, 238, 0.7)
    font_size = 50
    onclick = systemctl suspend
    position = -800, 100
    halign = right
    valign = bottom
}
